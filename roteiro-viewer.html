<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiros — Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e; --bg2: #161616; --bg3: #1e1e1e;
    --border: #2a2a2a; --text: #e8e4dc; --text-muted: #6b6560;
    --text-dim: #9a948c; --accent: #c8a96e; --accent2: #7c5cbf;
    --red: #c25a4a; --green: #4a8c6a; --coral: #c2704a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; font-size: 16px; line-height: 1.7; min-height: 100vh; }

  /* UPLOAD */
  #upload-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 40px 20px; }
  .brand { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
  .upload-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--accent); text-align: center; }
  .upload-sub { font-size: 14px; color: var(--text-muted); text-align: center; max-width: 380px; line-height: 1.6; }
  .drop-zone { width: 100%; max-width: 440px; border: 1.5px dashed var(--border); border-radius: 10px; padding: 48px 32px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
  .drop-zone:hover, .drop-zone.over { border-color: var(--accent); background: #1a1500; }
  .drop-icon { font-size: 32px; margin-bottom: 14px; color: var(--text-muted); }
  .drop-label { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
  .drop-sub { font-size: 12px; color: var(--text-muted); }
  .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .recent-section { width: 100%; max-width: 440px; }
  .recent-label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .recent-list { display: flex; flex-direction: column; gap: 6px; }
  .recent-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: border-color 0.15s; gap: 10px; }
  .recent-item:hover { border-color: var(--accent); }
  .recent-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .recent-date { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .recent-del { font-size: 14px; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: 3px; transition: color 0.15s; line-height: 1; }
  .recent-del:hover { color: var(--red); }
  .empty-recent { font-size: 12px; color: var(--text-muted); text-align: center; padding: 16px; border: 1px solid var(--border); border-radius: 6px; font-style: italic; }

  /* VIEWER */
  #viewer-screen { display: none; }
  .viewer-header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .viewer-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .back-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 13px; padding: 4px 10px; border-radius: 4px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .viewer-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .viewer-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .font-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 13px; padding: 4px 10px; border-radius: 4px; cursor: pointer; transition: all 0.15s; user-select: none; }
  .font-btn:hover { border-color: var(--accent); color: var(--accent); }
  .font-size-display { font-size: 12px; color: var(--text-muted); min-width: 32px; text-align: center; }
  .progress-bar { position: fixed; top: 0; left: 0; height: 2px; background: var(--accent); width: 0%; transition: width 0.1s; z-index: 200; }
  #content-frame { width: 100%; border: none; display: block; }
  .scrolltop { position: fixed; bottom: 24px; right: 20px; background: var(--bg3); border: 1px solid var(--border); color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 18px; width: 40px; height: 40px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s, border-color 0.2s; z-index: 100; }
  .scrolltop.visible { opacity: 1; }
  .scrolltop:hover { border-color: var(--accent); color: var(--accent); }
  .error-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2a1a1a; border: 1px solid var(--red); color: var(--red); font-size: 13px; padding: 10px 20px; border-radius: 6px; opacity: 0; transition: all 0.2s; z-index: 300; white-space: nowrap; }
  .error-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="progress-bar" id="progress"></div>

<div id="upload-screen">
  <div class="brand">Roteiros</div>
  <div class="upload-title">Carregue seu roteiro</div>
  <div class="upload-sub">Arraste ou selecione qualquer arquivo <code style="background:#1e1e1e;padding:2px 6px;border-radius:3px;color:var(--accent)">.md</code> de roteiro para visualizar.</div>
  <div class="drop-zone" id="dropZone">
    <input type="file" accept=".md,.markdown" id="fileInput">
    <div class="drop-icon">⊕</div>

  </div>
  <div class="recent-section">
    <div class="recent-label">Recentes</div>
    <div class="recent-list" id="recentList"></div>
  </div>
</div>

<div id="viewer-screen">
  <header class="viewer-header">
    <div class="viewer-left">
      <button class="back-btn" id="backBtn">← Voltar</button>
      <div class="viewer-title" id="viewerTitle">—</div>
    </div>
    <div class="viewer-controls">
      <button class="font-btn" onclick="changeFont(-1)">A−</button>
      <span class="font-size-display" id="fsDisplay">16px</span>
      <button class="font-btn" onclick="changeFont(1)">A+</button>
    </div>
  </header>
  <iframe id="content-frame" scrolling="no"></iframe>
</div>

<button class="scrolltop" id="scrolltop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="error-toast" id="errorToast"></div>

<script>
const DB_KEY = 'roteiros_recent_v2';
const sizes = [13, 14, 16, 19, 22];
let sizeIdx = 2;

// ─── BADGE COLORS ───────────────────────────────────────────────
const SECTION_COLORS = [
  'badge-gray','badge-amber','badge-blue','badge-pink',
  'badge-coral','badge-purple','badge-green','badge-teal','badge-red'
];
const KNOWN_BADGES = {
  'hook':         'badge-gray',
  'abertura':     'badge-gray',
  'bloco 1':      'badge-amber',
  'bloco 2':      'badge-blue',
  'bloco 3':      'badge-pink',
  'bloco 4':      'badge-coral',
  'bloco 5':      'badge-purple',
  'bloco 6':      'badge-green',
  'âncora':       'badge-coral',
  'ancora':       'badge-coral',
  'fechamento':   'badge-purple',
  'cta':          'badge-green',
};
function getBadgeColor(title, idx) {
  const lower = title.toLowerCase();
  for (const [k, v] of Object.entries(KNOWN_BADGES)) {
    if (lower.startsWith(k)) return v;
  }
  return SECTION_COLORS[idx % SECTION_COLORS.length];
}

// ─── MARKDOWN → ROTEIRO HTML ────────────────────────────────────
function parseRoteiro(md) {
  const lines = md.split('\n');
  let html = '';
  let sectionIdx = 0;
  let i = 0;
  let inSection = false;
  let inPoints = false;

  function closePoints() {
    if (inPoints) { html += '</div>'; inPoints = false; }
  }
  function closeSection() {
    closePoints();
    if (inSection) { html += '</div>'; inSection = false; }
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // inline markdown: **bold**, *italic*, `code`
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
  }

  // strip emoji from section titles for the badge label extraction
  function stripEmoji(s) {
    return s.replace(/[\u{1F000}-\u{1FFFF}]|[\u2600-\u27BF]|[\uD83C-\uDBFF\uDC00-\uDFFF]/gu, '').trim();
  }

  // detect if a blockquote paragraph is a director's note (short, no quotes, italic-like)
  function isNote(s) {
    return !s.startsWith('"') && !s.startsWith('\u201C') && s.length < 220;
  }

  while (i < lines.length) {
    const raw = lines[i];
    const line = raw.trimEnd();

    // ── H1: document title ──────────────────────────────────────
    if (/^# /.test(line)) {
      closeSection();
      const title = stripEmoji(line.slice(2).trim());
      html += `<div class="doc-title"><span>${esc(title)}</span></div>`;
      i++; continue;
    }

    // ── HR ──────────────────────────────────────────────────────
    if (/^---+$/.test(line.trim())) {
      closeSection();
      if (inSection || sectionIdx > 0) html += '<hr class="divider">';
      i++; continue;
    }

    // ── H2: new section ─────────────────────────────────────────
    if (/^## /.test(line)) {
      closeSection();
      const raw2 = stripEmoji(line.slice(3).trim());
      // split "Label — Title" or "Label: Title"
      const sep = raw2.match(/^(.+?)\s[—–-]\s(.+)$/);
      let badge = '', title = '';
      if (sep) { badge = sep[1].trim(); title = sep[2].trim(); }
      else { badge = raw2; title = ''; }
      const color = getBadgeColor(badge, sectionIdx++);
      html += `<div class="section"><div class="section-header">`;
      html += `<span class="badge ${color}">${esc(badge)}</span>`;
      if (title) html += `<span class="section-title">${esc(title)}</span>`;
      html += `</div>`;
      inSection = true;
      i++; continue;
    }

    // ── Numbered point ──────────────────────────────────────────
    if (/^\d+\. /.test(line)) {
      if (!inPoints) { html += '<div class="points">'; inPoints = true; }
      const num = line.match(/^(\d+)\. /)[1];
      const text = line.replace(/^\d+\. /, '');
      html += `<div class="point"><span class="point-num">${num}</span><div class="point-body">`;
      html += `<p class="point-text">${inline(text)}</p>`;
      // look ahead: gather sub-content (quotes, ret-boxes, notes) belonging to this point
      i++;
      while (i < lines.length) {
        const next = lines[i].trimEnd();
        if (!next.trim()) { i++; continue; }
        // blockquote inside a point
        if (/^> /.test(next) || /^>$/.test(next)) {
          // collect full blockquote block
          const bqLines = [];
          while (i < lines.length && (/^>/.test(lines[i]) || !lines[i].trim())) {
            if (!lines[i].trim()) { i++; break; }
            bqLines.push(lines[i].replace(/^>\s?/, ''));
            i++;
          }
          html += renderBlockquote(bqLines, true);
          continue;
        }
        // italic note line (*text*)
        if (/^\*[^*]/.test(next) && next.endsWith('*')) {
          html += `<p class="point-note">${inline(next.slice(1,-1))}</p>`;
          i++; continue;
        }
        // bold+content line (**Label:** text) → ret-box
        if (/^\*\*[^*]+\*\*:?/.test(next)) {
          const labelMatch = next.match(/^\*\*(.+?)\*\*:?\s*(.*)/);
          if (labelMatch) {
            html += `<div class="ret-box"><div class="ret-label">${esc(labelMatch[1])}</div>`;
            html += `<p>${inline(labelMatch[2])}</p></div>`;
            i++; continue;
          }
        }
        // another point or section → stop
        break;
      }
      html += `</div></div>`;
      continue;
    }

    // ── Blockquote (outside points) ─────────────────────────────
    if (/^>/.test(line)) {
      closePoints();
      const bqLines = [];
      while (i < lines.length && (/^>/.test(lines[i]) || !lines[i].trim())) {
        if (!lines[i].trim()) { i++; break; }
        bqLines.push(lines[i].replace(/^>\s?/, ''));
        i++;
      }
      html += renderBlockquote(bqLines, false);
      continue;
    }

    // ── Italic-only line → director note ────────────────────────
    if (/^\*[^*]/.test(line) && line.trimEnd().endsWith('*')) {
      closePoints();
      html += `<p class="point-note" style="margin:10px 0 10px 10px;border-left:2px solid #2a2a2a;padding-left:10px;">${inline(line.slice(1,-1))}</p>`;
      i++; continue;
    }

    // ── Plain paragraph ─────────────────────────────────────────
    if (line.trim()) {
      closePoints();
      html += `<p style="margin:0.75rem 0;color:var(--text);">${inline(line.trim())}</p>`;
    }
    i++;
  }

  closeSection();
  return html;
}

// Render a collected blockquote block
function renderBlockquote(bqLines, insidePoint) {
  // join non-empty lines, detect paragraphs
  const paras = [];
  let cur = [];
  for (const l of bqLines) {
    if (!l.trim()) { if (cur.length) { paras.push(cur.join(' ')); cur = []; } }
    else cur.push(l.trim());
  }
  if (cur.length) paras.push(cur.join(' '));

  if (!paras.length) return '';

  // detect **bold label** at start → ancora / cta style box
  if (/^\*\*[^*]+\*\*/.test(paras[0])) {
    const labelMatch = paras[0].match(/^\*\*(.+?)\*\*\s*(.*)/);
    if (labelMatch) {
      const label = labelMatch[1].toLowerCase();
      const rest0 = labelMatch[2];
      const rest = [rest0, ...paras.slice(1)].filter(Boolean);
      // detect CTA style
      const isCta = label.includes('câmera') || label.includes('camera') || label.includes('cta');
      const isAncora = label.includes('voz') || label.includes('pessoal') || label.includes('direto');
      if (isCta) {
        return `<div class="cta-box"><div class="cta-label">${esc(labelMatch[1])}</div>${rest.map(p=>`<p>${inlineEsc(p)}</p>`).join('')}</div>`;
      }
      if (isAncora) {
        return `<div class="ancora"><div class="ancora-label">${esc(labelMatch[1])}</div>${rest.map(p=>`<p>${inlineEsc(p)}</p>`).join('')}</div>`;
      }
      // generic hook box
      return `<div class="hook-box"><div class="hook-label">${esc(labelMatch[1])}</div>${rest.map(p=>`<p>${inlineEsc(p)}</p>`).join('')}</div>`;
    }
  }

  // detect attribution line (— Author, Book)
  const last = paras[paras.length - 1];
  const isQuote = last.startsWith('—') || last.startsWith('–') || last.startsWith('-');
  if (isQuote && paras.length >= 2) {
    const quoteText = paras.slice(0, -1).join(' ').replace(/^[""]/, '').replace(/[""]$/, '');
    const attr = last.replace(/^[—–-]\s*/, '');
    return `<div class="quote-block"><p>"${inlineEsc(quoteText)}"</p><span>${esc(attr)}</span></div>`;
  }

  // check if all lines are notes (short italic-ish, no attribution)
  const allNote = paras.every(p => isNote(p) && !p.startsWith('"'));
  if (allNote && !insidePoint) {
    return paras.map(p => `<p class="point-note" style="margin:10px 0 10px 10px;border-left:2px solid #2a2a2a;padding-left:10px;">${inlineEsc(p)}</p>`).join('');
  }

  // hook box (first section, multiple paras, no attribution)
  return `<div class="hook-box"><div class="hook-label">fala</div>${paras.map(p=>`<p>${inlineEsc(p)}</p>`).join('')}</div>`;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inlineEsc(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
}
function isNote(s) { return !s.startsWith('"') && !s.startsWith('\u201C') && s.length < 220; }

// ─── BUILD FULL HTML DOC ────────────────────────────────────────
function buildDoc(md, fontSize) {
  const body = parseRoteiro(md);
  return `<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0e;--bg2:#161616;--bg3:#1e1e1e;--border:#2a2a2a;--text:#e8e4dc;--text-muted:#6b6560;--text-dim:#9a948c;--accent:#c8a96e;--accent2:#7c5cbf;--red:#c25a4a;--green:#4a8c6a;--blue:#4a6c9c;--pink:#9c4a6c;--teal:#4a8c8c;--coral:#c2704a;--purple:#6c4a9c;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:${fontSize}px;line-height:1.7;padding:32px 20px 80px;}
.container{max-width:780px;margin:0 auto;}
.doc-title{padding:0 0 32px;border-bottom:1px solid var(--border);margin-bottom:40px;}
.doc-title span{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent);}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.badge{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:3px;white-space:nowrap;}
.badge-gray{background:#2a2a2a;color:#9a948c;}
.badge-red{background:#2a1a1a;color:#c25a4a;}
.badge-amber{background:#2a2210;color:#c8a96e;}
.badge-blue{background:#101a2a;color:#6a9ccc;}
.badge-pink{background:#2a101a;color:#cc6a9c;}
.badge-coral{background:#2a1a10;color:#c2704a;}

.cta-box p{color:#8ad4a2;line-height:1.75;font-style:italic;margin-top:6px;}
.cta-box p:first-of-type{margin-top:0;}

// ─── STORAGE ────────────────────────────────────────────────────
function getRecent() { try { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); } catch { return []; } }
function saveRecent(list) { localStorage.setItem(DB_KEY, JSON.stringify(list.slice(0, 8))); }
function addToRecent(name, md) {
  const list = getRecent().filter(r => r.name !== name);
  list.unshift({ name, md, date: new Date().toLocaleDateString('pt-BR') });
  saveRecent(list);
}

// ─── RECENT LIST UI ─────────────────────────────────────────────
function renderRecentList() {
  const list = getRecent();
  const el = document.getElementById('recentList');
  if (!list.length) { el.innerHTML = '<div class="empty-recent">Nenhum roteiro carregado ainda.</div>'; return; }
  el.innerHTML = list.map((r, i) => `
    <div class="recent-item" data-idx="${i}">
      <span class="recent-name">${r.name}</span>
      <span class="recent-date">${r.date}</span>
      <button class="recent-del" data-del="${i}" title="Remover">✕</button>
    </div>`).join('');
  el.querySelectorAll('.recent-item').forEach(item => {
    item.addEventListener('click', e => {
      if (e.target.classList.contains('recent-del')) return;
      const r = getRecent()[+item.dataset.idx];
      openRoteiro(r.name, r.md);
    });
  });
  el.querySelectorAll('.recent-del').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const updated = getRecent(); updated.splice(+btn.dataset.del, 1);
      saveRecent(updated); renderRecentList();
    });
  });
}

// ─── OPEN ────────────────────────────────────────────────────────
let currentMd = '';
function openRoteiro(name, md) {
  currentMd = md;
  const frame = document.getElementById('content-frame');
  document.getElementById('viewerTitle').textContent = name.replace(/\.md$/i,'').replace(/_/g,' ');
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('viewer-screen').style.display = 'block';
  renderFrame();
  window.scrollTo(0, 0);
}

function renderFrame() {
  const frame = document.getElementById('content-frame');
  const px = sizes[sizeIdx];
  document.getElementById('fsDisplay').textContent = px + 'px';
  const html = buildDoc(currentMd, px);
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  frame.src = url;
  frame.onload = () => { try { frame.style.height = (frame.contentDocument.body.scrollHeight + 40) + 'px'; } catch {} };
}

function changeFont(dir) {
  sizeIdx = Math.max(0, Math.min(sizes.length - 1, sizeIdx + dir));
  if (currentMd) renderFrame();
}

// ─── FILE LOAD ──────────────────────────────────────────────────
function showError(msg) {
  const t = document.getElementById('errorToast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function loadFile(file) {
  if (!file || !file.name.match(/\.md$/i)) { showError('Envie um arquivo .md'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const md = e.target.result;
    addToRecent(file.name, md);
    renderRecentList();
    openRoteiro(file.name, md);
  };
  reader.readAsText(file);
}

// ─── EVENTS ──────────────────────────────────────────────────────
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('over'); loadFile(e.dataTransfer.files[0]); });
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('viewer-screen').style.display = 'none';
  document.getElementById('upload-screen').style.display = 'flex';
  document.getElementById('content-frame').src = 'about:blank';
  document.getElementById('content-frame').style.height = '0';
  document.getElementById('progress').style.width = '0%';
  currentMd = ''; window.scrollTo(0, 0); renderRecentList();
});
window.addEventListener('scroll', () => {
  const total = document.body.scrollHeight - window.innerHeight;
  document.getElementById('progress').style.width = (total > 0 ? (window.scrollY/total)*100 : 0) + '%';
  document.getElementById('scrolltop').classList.toggle('visible', window.scrollY > 300);
});

renderRecentList();
</script>
